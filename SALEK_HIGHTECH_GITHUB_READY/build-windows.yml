name: Build SALEK HIGHTECH (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $vst = Get-ChildItem -Path build -Filter "*.vst3" -Recurse -Directory |
                 Select-Object -First 1

          $exe = Get-ChildItem -Path build -Filter "*.exe" -Recurse -File |
                 Where-Object { $_.FullName -notmatch "\\CMakeFiles\\" } |
                 Select-Object -First 1

          if (-not $vst) { throw "VST3 was not produced." }
          if (-not $exe) { throw "Standalone EXE was not produced." }

          Copy-Item $vst.FullName "dist\SALEK HIGHTECH.vst3" -Recurse
          Copy-Item $exe.FullName "dist\SALEK HIGHTECH.exe"

          Get-ChildItem dist -Recurse

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" `
            -DestinationPath "SALEK-HIGHTECH-Windows.zip" `
            -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SALEK-HIGHTECH-Windows
          path: SALEK-HIGHTECH-Windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SALEK-HIGHTECH-Windows.zip
          generate_release_notes: true
